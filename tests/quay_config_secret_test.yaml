suite: Ansible configuration external secret
templates:
  - templates/quay-config-externalsecret.yaml
tests:
  - it: projects user passwords from the secret store
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.secretStoreRef.name
          value: vault-backend
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.target.name
          value: quay-config-credentials
      - equal:
          path: spec.data[0].secretKey
          value: quay-admin-password
      - equal:
          path: spec.data[0].remoteRef.key
          value: secret/data/hub/infra/quay/quay-users
      - equal:
          path: spec.data[0].remoteRef.property
          value: quay-admin-password
      - equal:
          path: spec.data[1].secretKey
          value: quay-user-password
  - it: does not render when configuration is disabled
    set:
      configJob:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
