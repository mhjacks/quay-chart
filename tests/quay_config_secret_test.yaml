suite: Ansible configuration external secret
templates:
  - templates/quay-config-externalsecret.yaml
tests:
  - it: projects user passwords from the secret store
    set:
      quayConfig:
        credentials:
          key: secret/data/hub/infra/quay/quay-users
        users:
          - name: quayadmin
            email: quayadmin@example.com
            passwordProperty: quay-admin-password
            superuser: true
            initialize: true
          - name: developer1
            email: developer1@myorg.com
            passwordProperty: quay-user-password
            superuser: false
            initialize: false
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.secretStoreRef.name
          value: vault-backend
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.target.name
          value: quay-config-credentials
      - equal:
          path: spec.data[0].secretKey
          value: quay-admin-password
      - equal:
          path: spec.data[0].remoteRef.key
          value: secret/data/hub/infra/quay/quay-users
      - equal:
          path: spec.data[0].remoteRef.property
          value: quay-admin-password
      - equal:
          path: spec.data[1].secretKey
          value: quay-user-password
  - it: does not render when configuration is disabled
    set:
      configJob:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: does not render when quayConfig is disabled
    set:
      quayConfig:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
