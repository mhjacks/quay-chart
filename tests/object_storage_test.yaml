suite: Object storage backends
tests:
  - it: renders NooBaa in openshift-storage
    templates:
      - templates/mcg-noobaa.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NooBaa
      - equal:
          path: metadata.name
          value: noobaa
      - equal:
          path: metadata.namespace
          value: openshift-storage
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "33"
  - it: renders the pv-pool backing store before NooBaa
    templates:
      - templates/mcg-backingstore.yaml
    asserts:
      - isKind:
          of: BackingStore
      - equal:
          path: metadata.name
          value: noobaa-default-backing-store
      - equal:
          path: metadata.namespace
          value: openshift-storage
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "32"
      - equal:
          path: spec.pvPool.numVolumes
          value: 1
  - it: points the bucket class at the backing store
    templates:
      - templates/mcg-bucketclass.yaml
    asserts:
      - isKind:
          of: BucketClass
      - equal:
          path: spec.placementPolicy.tiers[0].backingStores[0]
          value: noobaa-default-backing-store
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "34"
  - it: does not render gateway resources for an existing ODF cluster
    templates:
      - templates/mcg-noobaa.yaml
      - templates/mcg-backingstore.yaml
      - templates/mcg-bucketclass.yaml
    set:
      objectStorage:
        mode: odf
    asserts:
      - hasDocuments:
          count: 0
