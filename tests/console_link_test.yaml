suite: Console link
templates:
  - templates/console-link.yaml
tests:
  - it: links the Quay route and embeds the Quay icon
    asserts:
      - isKind:
          of: ConsoleLink
      - equal:
          path: spec.text
          value: Red Hat Quay
      - equal:
          path: spec.location
          value: ApplicationMenu
      - equal:
          path: spec.applicationMenu.section
          value: Red Hat applications
      - equal:
          path: spec.href
          value: https://quay-registry-quay-quay-enterprise.apps.example.com
      - matchRegex:
          path: spec.applicationMenu.imageURL
          pattern: "^data:image/png;base64,iVBORw0KGgo"
  - it: honors an explicit href
    set:
      global:
        clusterDomain: cluster.example.com
      consoleLink:
        href: https://quay.example.com
    asserts:
      - equal:
          path: spec.href
          value: https://quay.example.com
  - it: builds the href from the cluster domain
    set:
      quay:
        name: q
        namespace: n
      global:
        clusterDomain: c.example.com
    asserts:
      - equal:
          path: spec.href
          value: https://q-quay-n.apps.c.example.com
  - it: can be disabled
    set:
      consoleLink:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
