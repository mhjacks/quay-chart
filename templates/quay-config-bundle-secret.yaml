{{- include "quay.config.validate" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.quay.configBundleSecret.name }}
  namespace: {{ .Values.quay.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "38"
type: Opaque
stringData:
  config.yaml: |
    FEATURE_USER_INITIALIZE: true
    FEATURE_GENERAL_OCI_SUPPORT: true
    BROWSER_API_CALLS_XHR_ONLY: false
    SUPER_USERS:
    {{- range .Values.quayConfig.users }}
    {{- if .superuser }}
    - {{ .name }}
    {{- end }}
    {{- end }}
    FEATURE_USER_CREATION: true
    ALLOW_PULLS_WITHOUT_STRICT_LOGGING: false
    AUTHENTICATION_TYPE: Database
    DEFAULT_TAG_EXPIRATION: 2w
    ENTERPRISE_LOGO_URL: /static/img/RH_Logo_Quay_Black_UX-horizontal.svg
    FEATURE_BUILD_SUPPORT: false
    FEATURE_DIRECT_LOGIN: true
    FEATURE_MAILING: false
    REGISTRY_TITLE: Red Hat Quay
    REGISTRY_TITLE_SHORT: Quay
    TEAM_RESYNC_STALE_TIME: 60m
    TESTING: false
    CREATE_NAMESPACE_ON_PUSH: true
    # Proxy all storage traffic through Quay instead of direct client access
    FEATURE_PROXY_STORAGE: true
    # Template only. quay-s3-credentials-setup replaces the placeholders
    # from the bound ObjectBucketClaim.
    DISTRIBUTED_STORAGE_CONFIG:
      default:
        - RHOCSStorage
        - hostname: PLACEHOLDER_BUCKET_HOST
          port: PLACEHOLDER_BUCKET_PORT
          is_secure: PLACEHOLDER_IS_SECURE
          storage_path: /datastorage/registry
          access_key: PLACEHOLDER_ACCESS_KEY
          secret_key: PLACEHOLDER_SECRET_KEY
          bucket_name: PLACEHOLDER_BUCKET_NAME
    DISTRIBUTED_STORAGE_DEFAULT_LOCATIONS: []
    DISTRIBUTED_STORAGE_PREFERENCE:
      - default
