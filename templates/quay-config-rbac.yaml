{{- if and .Values.quayConfig.enabled .Values.configJob.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quay-config
  namespace: {{ .Values.quay.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "40"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quay-config
  namespace: {{ .Values.quay.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "40"
rules:
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quay-config
  namespace: {{ .Values.quay.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "40"
subjects:
  - kind: ServiceAccount
    name: quay-config
    namespace: {{ .Values.quay.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: quay-config
{{- end }}
