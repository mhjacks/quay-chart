apiVersion: v1
kind: ConfigMap
metadata:
  name: quay-s3-credentials-setup
  namespace: {{ .Values.quay.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "38"
data:
  setup.sh: |
{{- .Files.Get "files/s3-credentials-setup.sh" | trim | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: quay-s3-credentials-setup
  namespace: {{ .Values.quay.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "39"
spec:
  backoffLimit: 5
  template:
    spec:
      securityContext:
        {{- include "quay.pod.securityContext" . | nindent 8 }}
      serviceAccountName: quay-s3-setup
      # Job needs an SA token for oc (CKV_K8S_38 skipped via checkov config)
      automountServiceAccountToken: true
      containers:
        - name: setup-s3-credentials
          image: {{ .Values.job.image | quote }}
          imagePullPolicy: Always
          securityContext:
            {{- include "quay.container.securityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.job.resources | nindent 12 }}
          env:
            - name: QUAY_NAMESPACE
              value: {{ .Values.quay.namespace | quote }}
            - name: OBC_NAME
              value: {{ .Values.objectStorage.objectBucketClaim.name | quote }}
            - name: CONFIG_SECRET
              value: {{ .Values.quay.configBundleSecret.name | quote }}
            - name: OUTPUT_SECRET
              value: {{ .Values.quay.configBundleSecret.s3Name | quote }}
          command:
            - /bin/bash
            - /scripts/setup.sh
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: script
          configMap:
            name: quay-s3-credentials-setup
            defaultMode: 0555
      restartPolicy: OnFailure
