consoleLink:
  # -- Create an ApplicationMenu ConsoleLink for the Quay route.
  enabled: true
  # -- ConsoleLink metadata.name.
  name: quay
  # -- Menu text.
  text: Red Hat Quay
  # -- Application menu section.
  section: Red Hat applications
  # -- Override the computed route URL. Empty builds the managed route
  # from quay.name, quay.namespace, and global.clusterDomain.
  href: ""

configJob:
  # -- Run the bootstrap Job and the reconciling CronJob.
  enabled: true
  # -- Image with ansible-core, ansible-galaxy, oc, and cURL.
  # Same default as job.image. The container home is /pattern-home.
  image: quay.io/validatedpatterns/imperative-container:v1
  imagePullPolicy: Always
  # -- Cron schedule for re-applying Quay configuration.
  schedule: "*/30 * * * *"
  # -- Job activeDeadlineSeconds for the bootstrap Job and CronJob pods.
  activeDeadlineSeconds: 1800
  backoffLimit: 5
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  # -- Install infra.quay_configuration into an emptyDir before the playbook.
  # Set false when configJob.image already contains the collection.
  installCollection: true
  # -- infra.quay_configuration version passed to ansible-galaxy.
  collectionVersion: "2.8.1"
  # -- Verify the Quay route TLS certificate. In-cluster routes often use
  # a private CA, so the default is false.
  validateCerts: false
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
