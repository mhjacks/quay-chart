global:
  # -- OpenShift cluster base domain. Used in the console link when
  # consoleLink.href is empty. The host is apps. plus this domain.
  clusterDomain: example.com

quay:
  # -- Namespace for the Quay registry and its configuration jobs.
  namespace: quay-enterprise
  # -- Name of the QuayRegistry resource. The managed route is this name
  # with -quay appended.
  name: quay-registry
  configBundleSecret:
    deploy: true
    # -- Template secret. The S3 job copies it and fills storage placeholders.
    name: quay-init-config-bundle-secret
    # -- Secret QuayRegistry reads after the S3 job fills credentials.
    s3Name: quay-config-with-s3
  storage:
    postgres:
      # -- Persistent volume size for the Quay PostgreSQL database.
      size: 50Gi
    clairpostgres:
      # -- Persistent volume size for the Clair PostgreSQL database.
      size: 50Gi

job:
  # -- Image for the S3 credentials Job. The Validated Patterns imperative
  # container provides oc.
  image: quay.io/validatedpatterns/imperative-container:v1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Object storage. mode mcg deploys the standalone Multicloud Object Gateway.
# mode odf uses the NooBaa gateway that a StorageCluster already created.
objectStorage:
  # -- mcg deploys the standalone Multicloud Object Gateway. odf consumes
  # an existing OpenShift Data Foundation StorageCluster.
  mode: mcg
  mcg:
    # -- Namespace of the NooBaa system. Must match the ODF operator namespace.
    namespace: openshift-storage
    system:
      # -- Name of the NooBaa custom resource.
      name: noobaa
    bucketClass:
      # -- BucketClass used by the default NooBaa storage class.
      name: noobaa-default-bucket-class
      placement:
        tiers:
          - backingStores:
              - noobaa-default-backing-store
    backingStore:
      # -- BackingStore that holds the gateway's persistent volumes.
      name: noobaa-default-backing-store
    # -- Size of the NooBaa PostgreSQL volume.
    dbSize: 50Gi
    pvPool:
      # -- Number of persistent volumes in the backing store pool.
      numVolumes: 1
      resources:
        requests:
          cpu: 800m
          memory: 800Mi
          storage: 50Gi
        limits:
          cpu: "1"
          memory: 4Gi
  objectBucketClaim:
    # -- ObjectBucketClaim name. The bound ConfigMap and Secret use this name.
    name: quay-bucket
    # -- Prefix passed to generateBucketName.
    bucketName: quay-datastore
    # -- StorageClass for the claim. Override for Ceph RGW, for example
    # ocs-storagecluster-ceph-rgw.
    storageClass: openshift-storage.noobaa.io

secretStore:
  # -- SecretStore or ClusterSecretStore that holds Quay user passwords.
  name: vault-backend
  # -- Kind of secretStore.name.
  kind: ClusterSecretStore

quayConfig:
  credentials:
    # -- Vault (or other backend) path extracted into quay-config-credentials.
    key: secret/data/hub/quay-users
  # Exactly one user must set initialize, and that user must be a superuser.
  # Organization names must be at least four characters. Repository names
  # use the namespace/name form.
  users:
    - name: quayadmin
      email: quayadmin@example.com
      # -- Property on credentials.key projected into the credentials Secret.
      passwordProperty: quay-admin-password
      superuser: true
      initialize: true
  organizations: []
  repositories: []

